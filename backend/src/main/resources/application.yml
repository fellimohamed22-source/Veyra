spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/veyra}
    username: ${DB_USER:veyra}
    password: ${DB_PASSWORD:veyra}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info,prometheus
veyra:
  jwt:
    issuer: veyra
    access-ttl-minutes: 15
    refresh-ttl-days: 30
    secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-bytes}
  storage:
    root: ${VEYRA_DOCUMENT_ROOT:./runtime/documents}
    max-file-size-mb: 10
  marketplace:
    min-lead-minutes: 120
    max-offer-window-hours: 24
    normal-close-before-minutes: 120
    short-close-before-minutes: 30
