spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/veyra}
    username: ${DB_USER:veyra}
    password: ${DB_PASSWORD:veyra}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info,prometheus
management.health.mail.enabled: false
veyra:
  locationiq:
    token: ${LOCATIONIQ_TOKEN:}
  jwt:
    issuer: veyra
    access-ttl-minutes: 15
    refresh-ttl-days: 30
    secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-bytes}
  crypto:
    pin-key: ${PIN_ENCRYPTION_KEY:dev-pin-key-must-be-32-bytes-long}
    # Rotation : ancienne clé, utilisée uniquement pour relire les PIN des
    # réservations confirmées avant le changement. À retirer ensuite.
    pin-key-previous: ${PIN_ENCRYPTION_KEY_PREVIOUS:}
  storage:
    root: ${VEYRA_DOCUMENT_ROOT:./runtime/documents}
    max-file-size-mb: 10
  marketplace:
    min-lead-minutes: 120
    max-offer-window-hours: 24
    normal-close-before-minutes: 120
    short-close-before-minutes: 30

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Clé publique Stripe (pk_...) du formulaire de carte web ; variable Render.
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    # Projet Firebase dont les ID tokens sont acceptés par /auth/firebase.
    # Identifiant public (présent dans google-services.json), pas un secret.
    project-id: ${FIREBASE_PROJECT_ID:veyra-4806a}

  google:
    # DEC-08 : Google Maps Platform (Places, Geocoding, Routes) côté serveur.
    # Sans clé, les fournisseurs OpenStreetMap actuels restent utilisés.
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}

  twilio:
    # DEC-06/07 : SMS passager (et, plus tard, appels masqués). Inactif tant
    # que ces trois valeurs ne sont pas définies. TWILIO_FROM : numéro
    # expéditeur, identifiant alphanumérique, ou Messaging Service (MG...).
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}

  guest:
    # Adresse publique du site web qui affiche /suivi/{jeton} (PART-13).
    base-url: ${VEYRA_GUEST_BASE_URL:}

  legal:
    # Version des textes acceptés, enregistrée avec chaque consentement
    # (user_consents). À remplacer par la version validée juridiquement
    # (DEC-14) ; changer la version permet d'exiger une nouvelle acceptation.
    terms-version: ${VEYRA_TERMS_VERSION:PENDING_LEGAL_REVIEW}
    privacy-version: ${VEYRA_PRIVACY_VERSION:PENDING_LEGAL_REVIEW}
    marketing-version: ${VEYRA_MARKETING_VERSION:PENDING_LEGAL_REVIEW}

  security:
    # true uniquement en développement local : autorise les valeurs par
    # défaut publiques de JWT_SECRET / PIN_ENCRYPTION_KEY ci-dessus.
    allow-dev-secrets: ${VEYRA_ALLOW_DEV_SECRETS:false}

  test-accounts:
    # false en production : suspend les comptes de test des migrations
    # V029/V030/V034 (mots de passe publics). Voir TestAccountsGuard.
    enabled: ${VEYRA_TEST_ACCOUNTS_ENABLED:true}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

  bootstrap-admin:
    email: ${VEYRA_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${VEYRA_BOOTSTRAP_ADMIN_PASSWORD:}

  websocket:
    allowed-origins: ${VEYRA_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
