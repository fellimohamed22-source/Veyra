# Veyra compatibility gateway: all /api/v1 endpoints still served by the existing monolith.
# Replace individual location upstreams only after contract/security tests pass.
events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  upstream legacy_backend { server backend:8080; keepalive 32; }
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 12m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /gateway-health {
      default_type application/json;
      return 200 '{"status":"UP","component":"veyra-gateway"}';
    }

    location / {
      proxy_pass http://legacy_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
    }
  }
}
