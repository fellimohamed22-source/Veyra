workflows:
  veyra-client-android:
    name: Veyra Client - Android debug APK
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile-client
    environment:
      flutter: stable
      # Toutes les valeurs nécessaires sont désormais codées en dur dans ce
      # fichier -- aucune configuration manuelle requise dans le dashboard
      # Codemagic. Choix explicite de l'utilisateur (dépôt privé, usage
      # personnel) : VEYRA_API_BASE_URL (URL publique du backend),
      # STRIPE_PUBLISHABLE_KEY (clé Stripe PUBLIABLE, conçue pour être
      # visible côté client) et le contenu de google-services.json (une clé
      # API Firebase Android, protégée par les règles de sécurité Firebase
      # et la restriction de package name côté Google, pas un secret serveur
      # classique -- elle finit de toute façon embarquée telle quelle dans
      # l'APK compilé).
      vars:
        PACKAGE_NAME: "com.veyra.client"
        VEYRA_API_BASE_URL: "https://veyra-wr6p.onrender.com"
        # Clé Stripe PUBLIABLE (pk_test_...) -- conçue par Stripe pour être
        # embarquée côté client, contrairement à la clé secrète (sk_...).
        # Codée en dur ici à la demande explicite de l'utilisateur, dépôt
        # privé à usage personnel.
        STRIPE_PUBLISHABLE_KEY: "pk_test_51UCQcEIPCTAADW4Ta8UzVc1bYrF9hbyA5re4iAg4bwrncb3bDHdfJnigBuOgqGZLdVz2d8jze040tjd3X8gijgef00No8YQ2b9"
    scripts:
      - name: Use a fixed debug keystore across builds
        script: |
          set -e
          # Même correctif que sur GitHub Actions : sans keystore fixe,
          # chaque nouvelle machine de build génère une clé de debug
          # différente, et Android refuse d'installer une mise à jour
          # signée par une clé différente de celle déjà installée
          # (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
          mkdir -p ~/.android
          cp .github/ci-keystores/debug.keystore ~/.android/debug.keystore

      - name: Generate android/ and fix package identity
        script: |
          set -e
          flutter create . --platforms=android --project-name veyra_client
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml

          sed -i 's/namespace = "com.example.veyra_client"/namespace = "com.veyra.client"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_client"/applicationId = "com.veyra.client"/' android/app/build.gradle.kts
          grep -q 'namespace = "com.veyra.client"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.veyra.client"' android/app/build.gradle.kts

          mkdir -p android/app/src/main/kotlin/com/veyra/client
          mv android/app/src/main/kotlin/com/example/veyra_client/MainActivity.kt android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          sed -i 's/package com.example.veyra_client/package com.veyra.client/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
          grep -q 'package com.veyra.client' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          # flutter_stripe requires MainActivity to extend
          # FlutterFragmentActivity, not flutter create's default plain
          # FlutterActivity -- confirmed by the actual exception captured
          # on a real device: "Your Main Activity class
          # com.veyra.client.MainActivity is not a subclass
          # FlutterFragmentActivity". Same fix as android-apk.yml.
          sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          grep -q 'FlutterFragmentActivity' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt

          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          cat > android/app/google-services.json << 'GSJEOF'
          {
            "project_info": {
              "project_number": "42273532770",
              "project_id": "veyra-4806a",
              "storage_bucket": "veyra-4806a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:42273532770:android:66b6f1fa6ad831b5c71a3b",
                  "android_client_info": {
                    "package_name": "com.veyra.client"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyApGifrfh1mMa9iQf6U4hsxFf6cXYeP_Ac"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:42273532770:android:c2bbed4e3363bc30c71a3b",
                  "android_client_info": {
                    "package_name": "com.veyra.driver"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyApGifrfh1mMa9iQf6U4hsxFf6cXYeP_Ac"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJEOF
          grep -q 'com.veyra.client' android/app/google-services.json

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL="$VEYRA_API_BASE_URL" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"

    artifacts:
      - mobile-client/build/app/outputs/flutter-apk/*.apk

  veyra-driver-android:
    name: Veyra Driver - Android debug APK
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile-driver
    environment:
      flutter: stable
      # Le fichier google-services.json des deux apps contient en réalité
      # les mêmes deux entrées (com.veyra.client et com.veyra.driver) --
      # Firebase génère un seul fichier par projet, pas un par app. Le
      # plugin Gradle sélectionne automatiquement la bonne entrée selon
      # l'applicationId au moment du build ; même contenu écrit ici que
      # dans le workflow client ci-dessus.
      vars:
        PACKAGE_NAME: "com.veyra.driver"
        VEYRA_API_BASE_URL: "https://veyra-wr6p.onrender.com"
        STRIPE_PUBLISHABLE_KEY: "pk_test_51UCQcEIPCTAADW4Ta8UzVc1bYrF9hbyA5re4iAg4bwrncb3bDHdfJnigBuOgqGZLdVz2d8jze040tjd3X8gijgef00No8YQ2b9"
    scripts:
      - name: Use a fixed debug keystore across builds
        script: |
          set -e
          mkdir -p ~/.android
          cp .github/ci-keystores/debug.keystore ~/.android/debug.keystore

      - name: Generate android/ and fix package identity
        script: |
          set -e
          flutter create . --platforms=android --project-name veyra_driver
          # Correctif réel confirmé par un vrai échec de build : file_picker
          # exige compileSdk >= 36, alors que flutter.compileSdkVersion
          # résout actuellement à 34.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts

          sed -i 's/namespace = "com.example.veyra_driver"/namespace = "com.veyra.driver"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_driver"/applicationId = "com.veyra.driver"/' android/app/build.gradle.kts
          grep -q 'namespace = "com.veyra.driver"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.veyra.driver"' android/app/build.gradle.kts

          mkdir -p android/app/src/main/kotlin/com/veyra/driver
          mv android/app/src/main/kotlin/com/example/veyra_driver/MainActivity.kt android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          sed -i 's/package com.example.veyra_driver/package com.veyra.driver/' android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
          grep -q 'package com.veyra.driver' android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt

          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          cat > android/app/google-services.json << 'GSJEOF'
          {
            "project_info": {
              "project_number": "42273532770",
              "project_id": "veyra-4806a",
              "storage_bucket": "veyra-4806a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:42273532770:android:66b6f1fa6ad831b5c71a3b",
                  "android_client_info": {
                    "package_name": "com.veyra.client"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyApGifrfh1mMa9iQf6U4hsxFf6cXYeP_Ac"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:42273532770:android:c2bbed4e3363bc30c71a3b",
                  "android_client_info": {
                    "package_name": "com.veyra.driver"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyApGifrfh1mMa9iQf6U4hsxFf6cXYeP_Ac"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJEOF
          grep -q 'com.veyra.driver' android/app/google-services.json

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL="$VEYRA_API_BASE_URL" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"

    artifacts:
      - mobile-driver/build/app/outputs/flutter-apk/*.apk
