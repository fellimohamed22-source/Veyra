services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_DB: veyra, POSTGRES_USER: veyra, POSTGRES_PASSWORD: veyra}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025","8025:8025"]
volumes: {pgdata: {}}
