services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: veyra
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/veyra
      DB_USER: veyra
      DB_PASSWORD: veyra
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      JWT_SECRET: local-development-jwt-secret-change-me-1234567890
      PIN_ENCRYPTION_KEY: local-pin-encryption-key-32bytes!
      VEYRA_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080
      VEYRA_DOCUMENT_ROOT: /app/runtime/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - documents:/app/runtime/documents
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  redisdata:
  documents:
