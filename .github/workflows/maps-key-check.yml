name: maps-key-check
# Checks the mobile Google Maps key without ever printing it: presence of
# the GOOGLE_MAPS_MOBILE_KEY secret and access to the Map Tiles API.
# The result is a public annotation on the run.

on:
  workflow_dispatch:
  push:
    branches: [product-marketplace-v4]
    paths:
      - '.github/workflows/maps-key-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google Maps mobile key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_MOBILE_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning title=Google Maps::GOOGLE_MAPS_MOBILE_KEY absente."
            exit 0
          fi
          try() {
            code=$(curl -s -o /tmp/maps.json -w '%{http_code}' -X POST \
              "https://tile.googleapis.com/v1/createSession?key=${MAPS_KEY}" \
              -H 'Content-Type: application/json' -d "$1")
            reason=$(grep -oE '"(status|message)": *"[^"]*"' /tmp/maps.json | head -2 | tr '\n' ' ' | tr -d '"')
            ok=$(grep -q '"session"' /tmp/maps.json && echo yes || echo no)
            echo "::notice title=Google Maps ($2)::HTTP $code session=$ok $reason"
            rm -f /tmp/maps.json
          }
          try '{"mapType":"roadmap","language":"fr-FR","region":"FR"}' "fr-FR/FR"
          try '{"mapType":"roadmap","language":"en-US","region":"US"}' "en-US/US"
          try '{"mapType":"roadmap","language":"fr-FR","region":"FR","scale":"scaleFactor2x","highDpi":true}' "fr-FR/FR x2"
          # Static Maps on the same key tells billing/key problems apart from Map Tiles ones.
          scode=$(curl -s -o /dev/null -w '%{http_code}' "https://maps.googleapis.com/maps/api/staticmap?center=48.8566,2.3522&zoom=12&size=64x64&key=${MAPS_KEY}")
          echo "::notice title=Google Maps (static)::Static Maps HTTP $scode"
