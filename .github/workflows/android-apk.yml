name: android-apk

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-client/**'
      - 'mobile-driver/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-client/**'
      - 'mobile-driver/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-client:
    runs-on: ubuntu-latest
    # Necessary to create/update a Release via gh -- the default
    # GITHUB_TOKEN only has read access to repo contents otherwise.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/ci-keystores/debug.keystore ~/.android/debug.keystore

      - name: Build Client APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euxo pipefail
          cd mobile-client
          flutter create . --platforms=android --project-name veyra_client

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

          sed -i 's/namespace = "com.example.veyra_client"/namespace = "com.veyra.client"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_client"/applicationId = "com.veyra.client"/' android/app/build.gradle.kts

          mkdir -p android/app/src/main/kotlin/com/veyra/client
          mv android/app/src/main/kotlin/com/example/veyra_client/MainActivity.kt android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          sed -i 's/package com.example.veyra_client/package com.veyra.client/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example

          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q 'com.veyra.client' android/app/google-services.json

          flutter pub get
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ vars.VEYRA_API_BASE_URL }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

          cp build/app/outputs/flutter-apk/app-debug.apk ../veyra-client-debug.apk

      # Real fix for the persistent "Artifact storage quota has been
      # hit" failure (actions/upload-artifact): GitHub Release assets
      # are a completely separate storage mechanism from Actions
      # artifact/cache storage, not subject to the same free-tier
      # limit that going private just tightened considerably.
      #
      # This job and build-driver run in parallel and can both try to
      # create the release at the same time -- `create` is allowed to
      # fail if the other job's create already won (|| true swallows
      # it), then `upload --clobber` adds or replaces this job's own
      # asset regardless of which job actually created the release.
      - name: Publish Client APK as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-debug-build-maps-live-tracking-v2 \
            --title "Derniers APK de debug (mis à jour automatiquement)" \
            --notes "Générés automatiquement à chaque build. Non signés pour la Play Store -- build de debug uniquement." \
            --prerelease \
            --target "${{ github.sha }}" 2>/dev/null || true
          gh release upload latest-debug-build-maps-live-tracking-v2 veyra-client-debug.apk --clobber

  build-driver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/ci-keystores/debug.keystore ~/.android/debug.keystore

      - name: Build Driver APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euxo pipefail
          cd mobile-driver
          flutter create . --platforms=android --project-name veyra_driver

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

          sed -i 's/namespace = "com.example.veyra_driver"/namespace = "com.veyra.driver"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_driver"/applicationId = "com.veyra.driver"/' android/app/build.gradle.kts

          mkdir -p android/app/src/main/kotlin/com/veyra/driver
          mv android/app/src/main/kotlin/com/example/veyra_driver/MainActivity.kt android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          sed -i 's/package com.example.veyra_driver/package com.veyra.driver/' android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example

          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q 'com.veyra.driver' android/app/google-services.json

          flutter pub get
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ vars.VEYRA_API_BASE_URL }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

          cp build/app/outputs/flutter-apk/app-debug.apk ../veyra-driver-debug.apk

      - name: Publish Driver APK as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-debug-build-maps-live-tracking-v2 \
            --title "Derniers APK de debug (mis à jour automatiquement)" \
            --notes "Générés automatiquement à chaque build. Non signés pour la Play Store -- build de debug uniquement." \
            --prerelease \
            --target "${{ github.sha }}" 2>/dev/null || true
          gh release upload latest-debug-build-maps-live-tracking-v2 veyra-driver-debug.apk --clobber
