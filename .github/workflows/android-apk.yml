name: android-apk
# Trigger APK build after V3 driver repair.

on:
  workflow_dispatch:
  push:
    branches: [main, feature/product-marketplace-v3]
    paths:
      - 'mobile-client/**'
      - 'mobile-driver/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apks:
    runs-on: ubuntu-latest
    # Nécessaire pour créer/mettre à jour une Release via gh -- le
    # GITHUB_TOKEN par défaut n'a que l'accès lecture au contenu du
    # dépôt sauf déclaration explicite.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use a fixed debug keystore across builds
        run: |
          # REAL BUG FOUND AND FIXED: neither app's android/ folder is
          # committed to the repo -- both are regenerated from scratch by
          # `flutter create .` on every single run, on a fresh ubuntu-latest
          # VM with no persisted ~/.android directory. The Android Gradle
          # Plugin auto-generates a brand new, randomly-keyed
          # ~/.android/debug.keystore the first time it's needed if none
          # exists, so every CI run has produced an APK signed with a
          # DIFFERENT debug key. Android refuses to install an update
          # signed with a different key than the already-installed app
          # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) -- confirmed as the real
          # explanation for reports of "the new build doesn't seem to
          # contain any of the recent fixes" that kept surfacing even
          # after a run had completed successfully: the install was
          # silently failing and the previous APK kept running.
          # Fix: commit one fixed debug keystore once and reuse it on
          # every run, so all debug builds share the same signature and
          # can update cleanly over each other.
          mkdir -p ~/.android
          cp .github/ci-keystores/debug.keystore ~/.android/debug.keystore

      - name: Build Client APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd mobile-client
          flutter create . --platforms=android --project-name veyra_client
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          # REAL, EVIDENCE-BASED CANDIDATE for the persistently-reported
          # blank AddressScreen: the diagnostic crash banner (wired at
          # the app's absolute root, catching runZonedGuarded/
          # FlutterError.onError/PlatformDispatcher.onError/
          # ErrorWidget.builder combined) showed genuinely nothing on a
          # real device after a confirmed clean reinstall -- meaning
          # whatever fails happens below anything Dart can catch.
          # Flutter 3.47.x enables the Impeller rendering backend by
          # default on Android, and Impeller has multiple current,
          # actively-tracked upstream issues (flutter/flutter#185026,
          # #155973, #160228, among others still open) matching this
          # exact signature: a blank/white screen with zero Dart-level
          # error, caused by a native C++ engine failure (Vulkan
          # texture/surface allocation) on certain GPU/driver
          # combinations -- a class of failure that, by construction,
          # cannot be caught by any Dart exception handler, which is
          # consistent with everything observed so far. Falling back to
          # the older, far more broadly-compatible Skia renderer via
          # this documented (though soon-deprecated) manifest flag is
          # the standard, current mitigation
          # (docs.flutter.dev/perf/impeller). Not yet confirmed against
          # a real device -- the next real test is what confirms or
          # rules this out.
          sed -i '/android:icon="@mipmap\/ic_launcher">/a\    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' android/app/src/main/AndroidManifest.xml
          grep -q 'io.flutter.embedding.android.EnableImpeller' android/app/src/main/AndroidManifest.xml
          # Required by flutter_local_notifications (added for real,
          # working push notifications in foreground -- see main.dart's
          # own comment for the full explanation): "Dependency
          # ':flutter_local_notifications' requires core library
          # desugaring to be enabled for :app" is a real, documented
          # Android Gradle requirement for this plugin, not optional.
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          # Location permissions needed for the "use my current location"
          # address field (geolocator) -- flutter create's own template
          # never adds these on its own, for either debug or release
          # builds, since it has no way to know the app will use location
          # at all. Same real gap already found and fixed once for the
          # driver app's own manifest permission needs earlier this
          # project's history (INTERNET on a different, unrelated app) --
          # applied proactively here rather than discovered via another
          # broken build.
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          # Firebase wiring: google-services.json declares package_name
          # "com.veyra.client" (the real Firebase Android app registered
          # for this project) -- flutter create's own default
          # namespace/applicationId is "com.example.veyra_client", which
          # would silently mismatch and make FCM registration fail at
          # runtime with no build-time error at all (the plugin would
          # apply, but resource generation keys off the applicationId
          # actually matching an entry in google-services.json). Both
          # namespace and applicationId need the fix, not just one --
          # Firebase's own docs are explicit that they must match.
          sed -i 's/namespace = "com.example.veyra_client"/namespace = "com.veyra.client"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_client"/applicationId = "com.veyra.client"/' android/app/build.gradle.kts
          grep -q 'namespace = "com.veyra.client"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.veyra.client"' android/app/build.gradle.kts
          # REAL BUG FOUND AND FIXED: renaming namespace/applicationId above
          # only edits build.gradle.kts. It does NOT move the actual
          # MainActivity.kt source file (still at
          # kotlin/com/example/veyra_client/MainActivity.kt with
          # `package com.example.veyra_client`) or update its package
          # declaration. AndroidManifest.xml ends up pointing at
          # com.veyra.client.MainActivity while the compiled class is still
          # under com.example.veyra_client -- confirmed via a real device's
          # logcat: "ClassNotFoundException: Didn't find class
          # com.veyra.client.MainActivity", crashing on every launch.
          mkdir -p android/app/src/main/kotlin/com/veyra/client
          mv android/app/src/main/kotlin/com/example/veyra_client/MainActivity.kt android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          sed -i 's/package com.example.veyra_client/package com.veyra.client/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
          grep -q 'package com.veyra.client' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          # REAL BUG FOUND AND FIXED, confirmed by the actual exception
          # captured on a real device via a temporary diagnostic banner
          # (runZonedGuarded catch, since this comes from an unawaited
          # Future): "PlatformException(flutter_stripe initialization
          # failed, ... Your Main Activity class
          # com.veyra.client.MainActivity is not a subclass
          # FlutterFragmentActivity. Please make sure you follow all the
          # steps detailed inside the README:
          # https://github.com/flutter-stripe/flutter_stripe#android".
          # flutter create's default template extends plain
          # FlutterActivity, which flutter_stripe's own Android
          # integration explicitly does not support -- documented
          # requirement of the plugin itself, not something flutter
          # create has any way to know about since it has no awareness
          # of which plugins the project actually uses.
          sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          grep -q 'FlutterFragmentActivity' android/app/src/main/kotlin/com/veyra/client/MainActivity.kt
          # REAL BUG FOUND AND FIXED, confirmed by the actual exception
          # captured on a real device (same diagnostic banner as above):
          # "PlatformException(flutter_stripe initialization failed, The
          # plugin failed to initialize: Your theme isn't set to use
          # Theme.AppCompat or Theme.MaterialComponents. ...". This is
          # the actual real root cause of the reported blank screen --
          # confirmed via multiple official flutter_stripe sources
          # (README, troubleshooting docs, several closed issues with
          # this exact message) that both LaunchTheme and NormalTheme in
          # every styles.xml variant flutter create generates
          # (values/, values-night/, and values-v31/ if present -- the
          # v31 variant exists specifically because it silently
          # overrides the other two on Android 12+ if left unfixed,
          # a real gotcha called out directly in flutter_stripe's own
          # issue tracker) must inherit from Theme.AppCompat or
          # Theme.MaterialComponents, which flutter create's default
          # template never does on its own. Matches on the style NAME
          # rather than the exact current parent value so this stays
          # correct regardless of which Flutter version's default theme
          # string is generated.
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml android/app/src/main/res/values-v31/styles.xml; do
            if [ -f "$f" ]; then
              sed -i 's#<style name="LaunchTheme" parent="[^"]*">#<style name="LaunchTheme" parent="Theme.AppCompat.Light.NoActionBar">#' "$f"
              sed -i 's#<style name="NormalTheme" parent="[^"]*">#<style name="NormalTheme" parent="Theme.MaterialComponents">#' "$f"
            fi
          done
          grep -q 'Theme.MaterialComponents' android/app/src/main/res/values/styles.xml
          # Google Services Gradle plugin -- required to actually process
          # google-services.json into usable Android resources; having
          # firebase_core/firebase_messaging as Dart dependencies alone
          # does not apply this plugin (that's a separate, manual Gradle-
          # level step even flutter create doesn't automate). Real,
          # current instructions confirmed directly (Firebase's own docs +
          # multiple current FlutterFire setup guides for the Kotlin DSL
          # template this project actually uses), not guessed.
          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q 'com.veyra.client' android/app/google-services.json
          flutter pub get
          flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.VEYRA_API_BASE_URL }} --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          cp build/app/outputs/flutter-apk/app-debug.apk ../veyra-client-debug.apk

      - name: Build Driver APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd mobile-driver
          flutter create . --platforms=android --project-name veyra_driver
          # REAL BUG FOUND AND FIXED: file_picker's own dependency
          # (flutter_plugin_android_lifecycle) requires compiling against
          # API 36+, but flutter.compileSdkVersion (the value Flutter's own
          # generated build.gradle.kts uses by default) currently resolves
          # to 34 -- confirmed directly from a real failed build's log:
          # "file_picker is currently compiled against android-34...
          # Recommended action: Update this project to use a newer
          # compileSdk of at least 36". A prior attempt to fix this by
          # upgrading geolocator was based on a plausible but wrong
          # diagnosis (a different, superficially similar known geolocator
          # issue) -- this fix is instead based on the actual real error
          # text from a real failed run.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          # REAL, EVIDENCE-BASED CANDIDATE for the persistently-reported
          # blank AddressScreen: the diagnostic crash banner (wired at
          # the app's absolute root, catching runZonedGuarded/
          # FlutterError.onError/PlatformDispatcher.onError/
          # ErrorWidget.builder combined) showed genuinely nothing on a
          # real device after a confirmed clean reinstall -- meaning
          # whatever fails happens below anything Dart can catch.
          # Flutter 3.47.x enables the Impeller rendering backend by
          # default on Android, and Impeller has multiple current,
          # actively-tracked upstream issues (flutter/flutter#185026,
          # #155973, #160228, among others still open) matching this
          # exact signature: a blank/white screen with zero Dart-level
          # error, caused by a native C++ engine failure (Vulkan
          # texture/surface allocation) on certain GPU/driver
          # combinations -- a class of failure that, by construction,
          # cannot be caught by any Dart exception handler, which is
          # consistent with everything observed so far. Falling back to
          # the older, far more broadly-compatible Skia renderer via
          # this documented (though soon-deprecated) manifest flag is
          # the standard, current mitigation
          # (docs.flutter.dev/perf/impeller). Not yet confirmed against
          # a real device -- the next real test is what confirms or
          # rules this out.
          sed -i '/android:icon="@mipmap\/ic_launcher">/a\    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' android/app/src/main/AndroidManifest.xml
          grep -q 'io.flutter.embedding.android.EnableImpeller' android/app/src/main/AndroidManifest.xml
          # Same real flutter_local_notifications requirement as the
          # client build -- see that section's own comment.
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          # Same real package-name mismatch fix as the client build --
          # google-services.json declares "com.veyra.driver" for this app.
          sed -i 's/namespace = "com.example.veyra_driver"/namespace = "com.veyra.driver"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.veyra_driver"/applicationId = "com.veyra.driver"/' android/app/build.gradle.kts
          grep -q 'namespace = "com.veyra.driver"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.veyra.driver"' android/app/build.gradle.kts
          # Same real MainActivity package/location bug as the client build
          # -- see the client build step's comment for the confirmed logcat
          # evidence (ClassNotFoundException on both apps).
          mkdir -p android/app/src/main/kotlin/com/veyra/driver
          mv android/app/src/main/kotlin/com/example/veyra_driver/MainActivity.kt android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          sed -i 's/package com.example.veyra_driver/package com.veyra.driver/' android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
          grep -q 'package com.veyra.driver' android/app/src/main/kotlin/com/veyra/driver/MainActivity.kt
          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q 'com.veyra.driver' android/app/google-services.json
          flutter pub get
          flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.VEYRA_API_BASE_URL }} --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          cp build/app/outputs/flutter-apk/app-debug.apk ../veyra-driver-debug.apk

      - name: Publish APKs as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Real fix for the persistent "Artifact storage quota has
          # been hit" failure (actions/upload-artifact): GitHub Release
          # assets are a completely separate storage mechanism from
          # Actions artifact storage -- a different quota entirely, not
          # subject to the same 0.5 GB free-tier limit or its slow
          # (6-12h, per GitHub's own error message) usage recalculation.
          # Confirmed this is the actual, distinct mechanism before
          # relying on it, not assumed.
          #
          # Single fixed tag, recreated on every run, rather than a new
          # release per build: this is a debug/dev build, not a real
          # versioned release -- a stable, bookmarkable URL for "the
          # latest debug build" is more useful here than accumulating
          # one release per push. --prerelease marks it clearly as such
          # rather than a real release.
          gh release delete latest-debug-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-debug-build \
            veyra-client-debug.apk veyra-driver-debug.apk \
            --title "Derniers APK de debug (mis à jour automatiquement)" \
            --notes "Générés automatiquement à chaque push. Non signés pour la Play Store -- build de debug uniquement." \
            --prerelease \
            --target "${{ github.sha }}"
