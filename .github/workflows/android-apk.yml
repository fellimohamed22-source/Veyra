name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-client/**'
      - 'mobile-driver/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Client APK
        run: |
          cd mobile-client
          flutter create . --platforms=android --project-name veyra_client
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../veyra-client-release.apk

      - name: Build Driver APK
        run: |
          cd mobile-driver
          flutter create . --platforms=android --project-name veyra_driver
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../veyra-driver-release.apk

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: veyra-client-apk
          path: veyra-client-release.apk
          if-no-files-found: error

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: veyra-driver-apk
          path: veyra-driver-release.apk
          if-no-files-found: error
