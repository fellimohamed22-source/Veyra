name: ios-build
# iOS twin of android-apk: same Dart code, same defines, iOS native config
# generated by .github/scripts/ios-prepare.sh. Unsigned build (compilation
# check); signing for TestFlight needs the Apple Developer certificates.

on:
  workflow_dispatch:
  push:
    branches: [product-marketplace-v4]
    paths:
      - 'mobile-client/**'
      - 'mobile-driver/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/ios-prepare.sh'

jobs:
  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile-client
            project: veyra_client
            bundle: com.veyra.client
            display: VEYRA
            kind: client
            plist_secret: GOOGLE_SERVICE_INFO_PLIST_CLIENT
          - app: mobile-driver
            project: veyra_driver
            bundle: com.veyra.driver
            display: VEYRA Chauffeur
            kind: driver
            plist_secret: GOOGLE_SERVICE_INFO_PLIST_DRIVER
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare iOS project
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets[matrix.plist_secret] }}
          GOOGLE_MAPS_MOBILE_KEY: ${{ secrets.GOOGLE_MAPS_MOBILE_KEY }}
        run: bash .github/scripts/ios-prepare.sh "${{ matrix.app }}" "${{ matrix.project }}" "${{ matrix.bundle }}" "${{ matrix.display }}" "${{ matrix.kind }}"
      - name: Build (no codesign)
        working-directory: ${{ matrix.app }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ vars.VEYRA_API_BASE_URL }} --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} --dart-define=GOOGLE_MAPS_MOBILE_KEY=${{ secrets.GOOGLE_MAPS_MOBILE_KEY }}
