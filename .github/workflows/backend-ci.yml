name: backend-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: veyra
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra -d veyra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/veyra
      DB_USER: veyra
      DB_PASSWORD: veyra
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long-veyra
      PIN_ENCRYPTION_KEY: ci-pin-encryption-key-32-bytes!!!
      SMTP_HOST: localhost
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -f backend/pom.xml test
      - run: mvn -B -f backend/pom.xml package -DskipTests
      - name: Smoke test Spring Boot startup and Flyway
        run: |
          java -jar backend/target/*.jar > /tmp/veyra-backend.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              cat /tmp/veyra-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/veyra-backend.log
          exit 1
