name: backend-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: veyra_test
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veyra -d veyra_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/veyra_test
      TEST_DATABASE_USER: veyra
      TEST_DATABASE_PASSWORD: veyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -f backend/pom.xml test
