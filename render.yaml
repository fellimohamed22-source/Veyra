services:
  # Site statique pour l'app web Angular (partenaire/admin/finance/support).
  # Ne redéfinit volontairement PAS le service backend existant
  # (veyra-wr6p, configuré manuellement via le dashboard Render) --
  # un blueprint qui "redéfinirait" un service déjà créé manuellement
  # pourrait entrer en conflit ou écraser sa config actuelle.
  - type: web
    name: veyra-web
    runtime: static
    repo: https://github.com/fellimohamed22-source/Veyra.git
    buildCommand: cd web && npm install && npm run build
    # Chemin de sortie réel vérifié par un build local exécuté dans cet
    # environnement (Angular 18, nouveau "application builder") :
    # dist/<project>/browser/, pas dist/<project>/ directement.
    staticPublishPath: web/dist/veyra-web/browser
    routes:
      # Fait passer chaque requête API par ce même domaine plutôt que par
      # l'URL directe du backend -- évite tout besoin de configuration
      # CORS, puisque le code de l'app (api.ts) utilise déjà un chemin
      # relatif "/api/v1" en dur, pensé pour être servi depuis la même
      # origine que le backend. Garder ce comportement tel quel plutôt
      # que de modifier le code pour pointer vers une URL absolue.
      - type: rewrite
        source: /api/*
        destination: https://veyra-wr6p.onrender.com/api/*
      # Route de secours SPA -- Angular gère son propre routage côté
      # client (rechargement sur /login, /partner, etc. doit renvoyer
      # index.html, pas une 404 du serveur statique).
      - type: rewrite
        source: /*
        destination: /index.html
