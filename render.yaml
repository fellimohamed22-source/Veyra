services:
  # Site statique pour l'app web Angular (partenaire/admin/finance/support).
  # Ne redéfinit volontairement PAS le service backend existant
  # (veyra-wr6p, configuré manuellement via le dashboard Render) --
  # un blueprint qui "redéfinirait" un service déjà créé manuellement
  # pourrait entrer en conflit ou écraser sa config actuelle.
  - type: web
    name: veyra-web
    runtime: static
    repo: https://github.com/fellimohamed22-source/Veyra.git
    buildCommand: cd web && npm install && npm run build
    # Chemin de sortie réel vérifié par un build local exécuté dans cet
    # environnement (Angular 18, nouveau "application builder") :
    # dist/<project>/browser/, pas dist/<project>/ directement.
    staticPublishPath: web/dist/veyra-web/browser
    routes:
      # Fallback SPA -- Angular gère son propre routage côté client
      # (rechargement sur /login, /partner, etc. doit renvoyer
      # index.html, pas une 404 du serveur statique). Chemin interne,
      # donc syntaxe valide pour un site statique Render.
      #
      # Contrairement à une version précédente de ce fichier : PAS de
      # règle de réécriture /api/* -> URL externe ici. Confirmé via la
      # documentation officielle Render qu'un site statique "never
      # proxies traffic" -- la destination d'une règle doit être un
      # chemin interne, jamais une URL complète. L'appel API se fait
      # maintenant directement vers l'URL absolue du backend, configurée
      # dans web/src/api.ts (avec l'origine de ce site ajoutée à
      # VEYRA_ALLOWED_ORIGINS côté backend une fois son URL connue).
      - type: rewrite
        source: /*
        destination: /index.html
